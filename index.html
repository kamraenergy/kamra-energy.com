<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAMRA FOR ENERGY CONTRACTING L.L.C.</title>

<style>

/* ==============================
   RESET
============================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    color: #172033;
    background: #f7f9fc;
    line-height: 1.6;
}


/* ==============================
   HEADER
============================== */

header {
    background: #0b1f3a;
    color: white;

    padding: 15px 7%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo img {
    height: 55px;
    width: auto;
    display: block;
}

.logo-text {
    display: none;
}

nav a {
    color: white;
    text-decoration: none;

    margin-left: 22px;

    font-size: 15px;

    transition: color 0.3s ease;
}

nav a:hover {
    color: #55b8ff;
}

.lang-btn {

    border: 1px solid #55b8ff;

    background: transparent;

    color: white;

    padding: 7px 12px;

    border-radius: 5px;

    cursor: pointer;

    margin-left: 20px;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}

.lang-btn:hover {

    background: #55b8ff;

    color: #0b1f3a;
}


/* ==============================
   HERO
============================== */

.hero {

    min-height: 620px;

    display: flex;

    align-items: center;

    padding: 80px 7%;

    background:
        linear-gradient(
            135deg,
            #0b1f3a,
            #123f68
        );

    color: white;
}

.hero-content {
    max-width: 850px;
}

.hero h1 {

    font-size: 52px;

    margin-bottom: 20px;

    line-height: 1.15;
}

.hero p {

    font-size: 20px;

    max-width: 700px;

    margin-bottom: 30px;

    color: #dce9f5;
}

.btn {

    display: inline-block;

    background: #1b9be0;

    color: white;

    padding: 13px 25px;

    text-decoration: none;

    border-radius: 5px;

    font-weight: bold;

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}

.btn:hover {

    background: #55b8ff;

    transform: translateY(-2px);
}


/* ==============================
   SECTIONS
============================== */

section {
    padding: 70px 7%;
}

.section-title {

    text-align: center;

    margin-bottom: 40px;
}

.section-title h2 {

    font-size: 34px;

    color: #0b1f3a;

    margin-bottom: 10px;
}

.section-title p {
    color: #64748b;
}

.about {
    background: white;
}


/* ==============================
   COMPANY CARDS
============================== */

.company-grid {

    max-width: 1100px;

    margin: 30px auto 0;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;
}


/* CARD */

.company-card {

    min-height: 185px;

    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #0b1f3a 0%,
            #123f68 65%,
            #155b86 100%
        );

    border: 1px solid
        rgba(85,184,255,0.25);

    border-radius: 15px;

    padding: 20px 15px;

    text-align: center;

    cursor: pointer;

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 7px 22px
        rgba(11,31,58,0.14);

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        border-color 0.35s ease;
}


/* LIGHT CIRCLE */

.company-card::after {

    content: "";

    position: absolute;

    width: 140px;
    height: 140px;

    top: -75px;
    right: -75px;

    background:
        rgba(85,184,255,0.12);

    border-radius: 50%;

    transition:
        width 0.4s ease,
        height 0.4s ease;
}


/* HOVER */

.company-card:hover {

    transform:
        translateY(-7px);

    border-color:
        #55b8ff;

    box-shadow:
        0 16px 38px
        rgba(11,31,58,0.27);
}

.company-card:hover::after {

    width: 190px;

    height: 190px;
}


/* TOP LINE */

.company-card::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 4px;

    background: #55b8ff;

    transform:
        scaleX(0);

    transform-origin:
        center;

    transition:
        transform 0.35s ease;
}

.company-card:hover::before {

    transform:
        scaleX(1);
}


/* ==============================
   CARD LOGO
============================== */

.card-logo {

    width: 48px;
    height: 48px;

    object-fit: contain;

    margin-bottom: 8px;

    position: relative;

    z-index: 2;

    /*
       مهم:
       لا يوجد filter هنا.
       الشعار يظهر بألوانه الأصلية.
    */

    opacity: 0.95;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;
}

.company-card:hover .card-logo {

    transform:
        scale(1.08);

    opacity: 1;
}


/* ==============================
   NUMBER
============================== */

.card-number {

    color: #55b8ff;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 3px;

    margin-bottom: 6px;

    position: relative;

    z-index: 2;
}


/* ==============================
   TITLE
============================== */

.company-card h3 {

    color: white;

    font-size: 17px;

    line-height: 1.3;

    margin-bottom: 5px;

    position: relative;

    z-index: 2;
}


/* ==============================
   ARABIC
============================== */

.company-card p {

    color: #dce9f5;

    font-size: 13px;

    line-height: 1.4;

    position: relative;

    z-index: 2;
}


/* ==============================
   VIDEO
============================== */

.video-icon {

    color: #55b8ff;

    font-size: 30px;

    margin-bottom: 4px;

    position: relative;

    z-index: 2;
}


/* ==============================
   UPDATE
============================== */

.update-card {

    cursor: default;

    opacity: 0.45;

    background:
        linear-gradient(
            145deg,
            #172a42,
            #23425e
        );
}

.update-card:hover {

    transform: none;

    border-color:
        rgba(85,184,255,0.25);

    box-shadow:
        0 7px 22px
        rgba(11,31,58,0.14);
}

.update-card:hover::before {

    transform:
        scaleX(0);
}

.update-card:hover::after {

    width: 140px;

    height: 140px;
}

.update-text {

    color: #b9cfe0;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 2px;

    position: relative;

    z-index: 2;
}


/* ==============================
   PDF / VIDEO VIEWER
============================== */

.company-viewer {

    position: fixed;

    inset: 0;

    z-index: 9999;

    background:
        rgba(7,20,38,0.94);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 30px;
}

.company-viewer.active {

    display: flex;
}


/* VIEWER */

.viewer-content {

    width:
        min(950px, 94vw);

    height:
        86vh;

    background: white;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.45);
}


/* IFRAME */

.viewer-content iframe {

    width: 100%;

    height: 100%;

    border: none;

    display: block;
}


/* ==============================
   CLOSE BUTTON
============================== */

.viewer-close {

    position: absolute;

    top: 15px;

    right: 25px;

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: white;

    color: #0b1f3a;

    font-size: 32px;

    cursor: pointer;

    z-index: 10000;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}

.viewer-close:hover {

    background:
        #1b9be0;

    color: white;
}


/* ==============================
   SERVICES
============================== */

.services {
    background: #f7f9fc;
}

.cards {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;
}

.card {

    background: white;

    padding: 27px;

    border-radius: 10px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.07);

    text-align: center;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.card:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 12px 30px
        rgba(11,31,58,0.12);
}

.card h3 {

    color: #0b1f3a;

    margin-bottom: 10px;
}

.card p {
    color: #64748b;
}


/* ==============================
   HSE
============================== */

.hse {

    background:
        #0b1f3a;

    color: white;

    text-align: center;
}

.hse h2 {

    font-size: 34px;

    margin-bottom: 20px;
}

.hse p {

    max-width: 850px;

    margin: auto;

    color: #dce9f5;

    font-size: 18px;
}


/* ==============================
   CONTACT
============================== */

.contact {

    background: white;

    text-align: center;
}

.contact-box {

    max-width: 700px;

    margin: auto;
}

.contact-box p {

    margin: 12px 0;

    font-size: 18px;
}


/* ==============================
   FOOTER
============================== */

footer {

    background:
        #071426;

    color:
        #b9c6d5;

    text-align:
        center;

    padding:
        25px;
}


/* ==============================
   LANGUAGE
============================== */

.ar {
    display: none;
}

body.rtl {
    direction: rtl;
}

body.rtl nav a {

    margin-left: 0;

    margin-right: 22px;
}

body.rtl .lang-btn {

    margin-left: 0;

    margin-right: 20px;
}


/* ==============================
   TABLET
============================== */

@media (max-width: 1000px) {

    .company-grid {

        grid-template-columns:
            repeat(3, 1fr);
    }
}


/* ==============================
   MOBILE / TABLET
============================== */

@media (max-width: 800px) {

    header {

        flex-direction:
            column;

        gap: 15px;
    }

    nav a {

        margin:
            0 6px;
    }

    .hero h1 {

        font-size:
            38px;
    }

    .cards {

        grid-template-columns:
            1fr;
    }
}


/* ==============================
   MOBILE
============================== */

@media (max-width: 600px) {

    section {

        padding:
            50px 5%;
    }


    /* HEADER */

    header {

        padding:
            13px 5%;
